name: Build feed

on:
  schedule:
    # Mon–Fri 08:00, 12:00, 17:00 Copenhagen in winter (CET = UTC+1).
    # Summer (CEST) these land 1h later. GitHub cron may also lag 5–15 min.
    - cron: '0 7,11,16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          FEED_URL: ${{ steps.pages.outputs.base_url }}/rss.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Public repos auto-disable cron after 60 days without commits; re-enabling resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
